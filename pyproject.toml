[project]
name = "pico-mcp"
version = "0.1.0"
description = "MCP stdio server: interact with, program, and flash a Raspberry Pi Pico (RP2040/RP2350) over USB"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.9",
    "pyserial>=3.5",
    "cobs==1.2.2",
]

[project.scripts]
pico-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["server.py", "serial_protocol.py", "proto.py"]
